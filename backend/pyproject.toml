[project]
name = "deep-researcher"
version = "0.0.1"
description = "Checkpointed web research with hybrid retrieval, cited reports, and a local workspace."
authors = [
    { name = "Yang" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "tavily-python>=0.5.0",
    "python-dotenv==1.0.1",
    "openai>=1.12.0",
    "uvicorn[standard]>=0.32.0",
    "ddgs>=9.6.1",
    "pydantic>=2.11",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "filelock==3.32.7",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "numpy>=1.26",
    "fastembed>=0.9.1,<0.10; sys_platform != 'win32'",
    # Windows 使用 GPU 运行时；它也提供 CPU 执行器，避免两个 ONNX 包覆盖同名模块。
    "fastembed-gpu>=0.9.1,<0.10; sys_platform == 'win32'",
    # 固定 CUDA 12 系列，在项目环境中提供 DLL，不依赖系统 CUDA Toolkit。
    "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27; sys_platform == 'win32'",
    # 12.9.3 暂无 Windows wheel，固定已有 Windows 构建的版本。
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
    "scipy>=1.15.3",
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"  # 声明：所有顶层包/模块都在 src 目录下

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools.packages.find]
where = ["src"]  # 在src目录下自动查找Python包（比如services）

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]   # 把 src 加入 Python 搜索路径
testpaths = ["tests"]  # 默认测试目录
addopts = "-v"         # 默认显示详细输出

[tool.ruff]
lint.select = [
    "E",
    "F",
    "I",
    "D",
    "D401",
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.27",
    "mypy>=1.11.1",
    "ruff>=0.6.1",
]
